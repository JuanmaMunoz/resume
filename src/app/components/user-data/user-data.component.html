@if (resumeService.infoUser(); as infoUser) {
  <div class="user-data text-center">
    <p class="text-primary-emphasis mb-0">
      {{ infoUser.name }}
      <a
        href="https://www.linkedin.com/in/juan-manuel-mu%C3%B1oz-gonz%C3%A1lez/"
        target="_blank"
        [attr.aria-label]="'accessibility.linkedin' | translate"
        ><i class="bi bi-linkedin text-info ms-1"></i
      ></a>
    </p>
    <p class="text-secondary mb-0">{{ infoUser.email }}</p>
  </div>
}
