<div class="mode-dark form-check form-switch">
  <input
    id="{{ id }}"
    class="form-check-input"
    type="checkbox"
    [(ngModel)]="modeDark"
    (ngModelChange)="changeModeDark()"
    [attr.aria-label]="'accessibility.darkMode' | translate"
  />
  <label for="{{ id }}" class="form-check-label"><i class="bi bi-moon-stars-fill"></i></label>
</div>
